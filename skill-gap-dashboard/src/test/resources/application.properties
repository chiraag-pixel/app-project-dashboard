# Test profile configuration: in-memory H2 (MySQL-compatible mode).
# MySQL remains the production/development database; tests must not require a server.
spring.datasource.url=jdbc:h2:mem:skillgap-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload-dir=${java.io.tmpdir}/skillgap-test-uploads
app.security.login-max-attempts=5
app.security.login-lock-minutes=5
app.seed-demo-data=true
