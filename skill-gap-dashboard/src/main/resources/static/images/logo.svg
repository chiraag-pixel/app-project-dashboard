<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 56" width="208" height="56" role="img" aria-label="SkillGap Analysis Dashboard">
  <!-- App icon: rounded navy square with an ascending bar chart -->
  <rect x="0" y="4" width="48" height="48" rx="10" fill="#16243b"/>
  <!-- bars 1-3: pale light-blue, increasing height -->
  <rect x="8.25" y="32" width="6" height="12" fill="#add6e8"/>
  <rect x="16.75" y="26" width="6" height="18" fill="#add6e8"/>
  <rect x="25.25" y="20" width="6" height="24" fill="#add6e8"/>
  <!-- bar 4: solid teal-green base with a dashed gold continuation above -->
  <rect x="33.75" y="16" width="6" height="28" fill="#19a08c"/>
  <rect x="33.75" y="6" width="6" height="10" fill="none" stroke="#e9b949" stroke-width="1.5" stroke-dasharray="3 2.5"/>
  <!-- Wordmark -->
  <text x="58" y="27" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
        font-size="19" font-weight="700" fill="#16243b">Skill<tspan fill="#19a08c">Gap</tspan></text>
  <text x="58" y="41" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
        font-size="8.5" font-weight="600" letter-spacing="1.6" fill="#5c6b80">ANALYSIS DASHBOARD</text>
</svg>
