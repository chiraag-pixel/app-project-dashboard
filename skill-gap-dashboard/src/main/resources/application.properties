# ---------------------------------------------------------------------------
# Skill Gap Analysis Dashboard - application configuration
# Local defaults below are overridden by environment variables when set.
# Never commit real passwords; see application.properties.example at project root.
# ---------------------------------------------------------------------------

spring.application.name=Skill Gap Analysis Dashboard
server.port=8080

# --- Database (MySQL 8) -----------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillgap?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Repeatable schema setup: Hibernate creates/updates the schema from entities.
spring.jpa.hibernate.ddl-auto=update
# Keep the JPA session open during Thymeleaf rendering so lazy relations
# (e.g. run -> document, assessment -> questions) can be read on the page.
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# --- Web / uploads ----------------------------------------------------------
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=${UPLOAD_DIR:./data/uploads}

# --- Security ---------------------------------------------------------------
app.security.login-max-attempts=5
app.security.login-lock-minutes=5

# --- Demo seed data (set to false to skip demo accounts) --------------------
app.seed-demo-data=true
