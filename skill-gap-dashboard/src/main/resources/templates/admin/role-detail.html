<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Role Requirements')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('/admin')}"></aside>
    <div class="main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="content">

            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="page-title mb-1" th:text="${role.name}">Java Developer</h2>
                    <p class="page-subtitle mb-0" th:text="${role.description} ?: 'No description'">desc</p>
                </div>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/roles}">&larr; All roles</a>
            </div>

            <!-- Current requirements -->
            <div class="card mt-3">
                <div class="card-header">Required skills</div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle" th:if="${!role.skills.isEmpty()}">
                        <thead>
                        <tr>
                            <th>Skill</th><th class="text-end">Required level</th><th class="text-end">Weight</th>
                            <th>Type</th><th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="rs : ${role.skills}">
                            <td><strong th:text="${rs.skill.name}">Java</strong></td>
                            <td class="text-end" th:text="${@ui.levelLabel(rs.requiredLevel)}">level</td>
                            <td class="text-end" th:text="${rs.weight}">3</td>
                            <td th:text="${rs.requirementType}">REQUIRED</td>
                            <td class="text-end">
                                <form th:action="@{/admin/roles/{id}/skills/{sid}/remove(id=${role.id}, sid=${rs.skill.id})}"
                                      method="post" class="d-inline">
                                    <button class="btn btn-sm btn-outline-danger" type="submit"
                                            data-confirm="Remove this requirement?">Remove</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="empty-state m-3" th:if="${role.skills.isEmpty()}">
                        <p class="mb-0">No skills configured yet - add the first requirement below.</p>
                    </div>
                </div>
            </div>

            <!-- Add/update requirement -->
            <div class="card mt-3">
                <div class="card-header">Add or update a requirement</div>
                <div class="card-body">
                    <form th:action="@{/admin/roles/{id}/skills/set(id=${role.id})}" method="post"
                          class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label">Skill</label>
                            <select class="form-select" name="skillId" required>
                                <option th:each="s : ${skills}" th:value="${s.id}" th:text="${s.name}">Java</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Required level</label>
                            <select class="form-select" name="requiredLevel">
                                <option th:each="lvl : ${@ui.range(1,5)}" th:value="${lvl}"
                                        th:text="${@ui.levelLabel(lvl)}">3 - Intermediate</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Weight (1-5)</label>
                            <select class="form-select" name="weight">
                                <option th:each="w : ${@ui.range(1,5)}" th:value="${w}" th:text="${w}">3</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Type</label>
                            <select class="form-select" name="type">
                                <option value="REQUIRED">Required</option>
                                <option value="PREFERRED">Preferred</option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <button class="btn btn-primary w-100" type="submit">Save</button>
                        </div>
                    </form>
                    <p class="muted mt-2 mb-0" style="font-size:0.78rem">
                        Saving an existing skill again updates its level/weight. Alignment uses REQUIRED rows only.
                    </p>
                </div>
            </div>

        </main>
    </div>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
