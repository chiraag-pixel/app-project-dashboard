<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Job Roles')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('/admin')}"></aside>
    <div class="main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="content">

            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="d-flex justify-content-between align-items-center">
                <h2 class="page-title">Job roles</h2>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin}">&larr; Admin home</a>
            </div>

            <div class="row g-3">
                <div class="col-lg-5">
                    <div class="card">
                        <div class="card-header">Add role</div>
                        <div class="card-body">
                            <form th:action="@{/admin/roles/add}" method="post">
                                <div class="mb-3">
                                    <label class="form-label" for="rName">Name *</label>
                                    <input class="form-control" id="rName" name="name" required
                                           placeholder="e.g. Mobile Developer">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="rDesc">Description</label>
                                    <textarea class="form-control" id="rDesc" name="description" rows="3"
                                              placeholder="Optional"></textarea>
                                </div>
                                <button class="btn btn-primary" type="submit">Create role</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="card h-100">
                        <div class="card-header">Roles</div>
                        <div class="card-body p-0">
                            <table class="table table-hover" th:if="${!roles.isEmpty()}">
                                <thead><tr><th>Role</th><th class="text-end">Actions</th></tr></thead>
                                <tbody>
                                <tr th:each="role : ${roles}">
                                    <td>
                                        <strong th:text="${role.name}">Java Developer</strong>
                                        <div class="muted" style="font-size:0.78rem"
                                             th:text="${role.description} ?: 'No description'">desc</div>
                                    </td>
                                    <td class="text-end">
                                        <a class="btn btn-sm btn-primary"
                                           th:href="@{/admin/roles/{id}(id=${role.id})}">Requirements</a>
                                        <form th:action="@{/admin/roles/{id}/delete(id=${role.id})}" method="post"
                                              class="d-inline">
                                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                                    data-confirm="Delete this role?">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                            <div class="empty-state m-3" th:if="${roles.isEmpty()}">
                                <p class="mb-0">No job roles yet - create the first one.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
