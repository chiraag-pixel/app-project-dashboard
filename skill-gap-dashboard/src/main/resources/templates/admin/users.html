<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Users')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('/admin')}"></aside>
    <div class="main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="content">

            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="d-flex justify-content-between align-items-center">
                <h2 class="page-title">Users</h2>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin}">&larr; Admin home</a>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr><th>Name</th><th>Email</th><th>Role</th><th>Last login</th><th class="text-end">Actions</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="u : ${users}">
                                <form th:action="@{/admin/users/{id}(id=${u.id})}" method="post">
                                    <td th:text="${u.fullName}">Name</td>
                                    <td th:text="${u.email}">email</td>
                                    <td>
                                        <select class="form-select form-select-sm" name="role" style="width:8rem">
                                            <option value="USER" th:selected="${u.role.name() == 'USER'}">USER</option>
                                            <option value="ADMIN" th:selected="${u.role.name() == 'ADMIN'}">ADMIN</option>
                                        </select>
                                    </td>
                                    <td th:text="${u.lastLoginAt != null} ? ${@ui.dateTime(u.lastLoginAt)} : 'never'">-</td>
                                    <td class="text-end">
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="checkbox" name="enabled"
                                                   value="true" th:checked="${u.enabled}">
                                            <label class="form-check-label">enabled</label>
                                        </div>
                                        <button class="btn btn-sm btn-primary" type="submit"
                                                data-confirm="Save changes for this user?">Save</button>
                                    </td>
                                </form>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
