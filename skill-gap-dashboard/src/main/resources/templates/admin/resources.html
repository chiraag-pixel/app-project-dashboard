<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Learning Resources')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('/admin')}"></aside>
    <div class="main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="content">

            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="d-flex justify-content-between align-items-center">
                <h2 class="page-title">Learning resources</h2>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin}">&larr; Admin home</a>
            </div>

            <div class="card mb-3">
                <div class="card-header">Add resource</div>
                <div class="card-body">
                    <form th:action="@{/admin/resources/add}" method="post" class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label">Title *</label>
                            <input class="form-control" name="title" required placeholder="e.g. Spring Boot tutorial">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">URL *</label>
                            <input class="form-control" name="url" required placeholder="https://...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Skill</label>
                            <select class="form-select" name="skillId">
                                <option value="">-- none --</option>
                                <option th:each="s : ${skills}" th:value="${s.id}" th:text="${s.name}">Java</option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <label class="form-label">Difficulty</label>
                            <select class="form-select" name="difficulty">
                                <option th:each="d : ${@ui.range(1,5)}" th:value="${d}" th:text="${d}">3</option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <label class="form-label">Hours</label>
                            <input class="form-control" type="number" name="estimatedHours" step="0.5" min="0">
                        </div>
                        <div class="col-md-1">
                            <label class="form-label">Description</label>
                            <input class="form-control" name="description" placeholder="Optional">
                        </div>
                        <div class="col-md-1">
                            <button class="btn btn-primary w-100" type="submit">Add</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Resources (<span th:text="${resources.size()}">0</span>)</div>
                <div class="card-body p-0">
                    <table class="table table-hover" th:if="${!resources.isEmpty()}">
                        <thead>
                        <tr><th>Title</th><th>Skill</th><th class="text-end">Level</th>
                            <th class="text-end">Hours</th><th>Status</th><th class="text-end">Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${resources}">
                            <td>
                                <a th:href="${r.url}" target="_blank" rel="noopener"
                                   th:text="${r.title}">Title</a>
                                <div class="muted" style="font-size:0.78rem" th:text="${r.description} ?: '-'">desc</div>
                            </td>
                            <td th:text="${r.skill != null} ? ${r.skill.name} : '-'">skill</td>
                            <td class="text-end" th:text="${r.difficulty} + '/5'">3/5</td>
                            <td class="text-end" th:text="${r.estimatedHours != null} ? ${r.estimatedHours} : '-'">-</td>
                            <td>
                                <span th:class="${r.active} ? 'badge badge-met' : 'badge badge-low'"
                                      th:text="${r.active} ? 'Active' : 'Hidden'">Active</span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/admin/resources/{id}/status(id=${r.id})}" method="post"
                                      class="d-inline">
                                    <input type="hidden" name="active" th:value="${!r.active}">
                                    <button class="btn btn-sm btn-outline-secondary" type="submit"
                                            th:text="${r.active} ? 'Hide' : 'Show'">Hide</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="empty-state m-3" th:if="${resources.isEmpty()}">
                        <p class="mb-0">No learning resources yet - recommendations will use generic advice until you add some.</p>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
