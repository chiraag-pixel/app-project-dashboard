<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Categories')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('/admin')}"></aside>
    <div class="main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="content">

            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="d-flex justify-content-between align-items-center">
                <h2 class="page-title">Skill categories</h2>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin}">&larr; Admin home</a>
            </div>

            <div class="row g-3">
                <div class="col-lg-7">
                    <div class="card h-100">
                        <div class="card-header">Existing categories</div>
                        <div class="card-body p-0">
                            <table class="table table-hover" th:if="${!categories.isEmpty()}">
                                <thead><tr><th>Name</th><th>Description</th><th class="text-end">Actions</th></tr></thead>
                                <tbody>
                                <tr th:each="c : ${categories}">
                                    <td><strong th:text="${c.name}">Programming languages</strong></td>
                                    <td th:text="${c.description} ?: '-'">desc</td>
                                    <td class="text-end">
                                        <form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"
                                              class="d-inline">
                                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                                    data-confirm="Delete this category? Skills in it keep their own category reference removed.">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                            <div class="empty-state m-3" th:if="${categories.isEmpty()}">
                                <p class="mb-0">No categories yet - add the first one.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card h-100">
                        <div class="card-header">Add category</div>
                        <div class="card-body">
                            <form th:action="@{/admin/categories/add}" method="post">
                                <div class="mb-3">
                                    <label class="form-label" for="catName">Name</label>
                                    <input class="form-control" id="catName" name="name" required
                                           placeholder="e.g. Cloud and DevOps">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="catDesc">Description</label>
                                    <input class="form-control" id="catDesc" name="description" placeholder="Optional">
                                </div>
                                <button class="btn btn-primary" type="submit">Add category</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
