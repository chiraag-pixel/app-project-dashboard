<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Take Assessment')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('/assessments')}"></aside>
    <div class="main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="content">

            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="page-title mb-1" th:text="${assessment.title}">Assessment</h2>
                    <p class="page-subtitle mb-0">
                        Skill: <strong th:text="${assessment.skill.name}">Java</strong>
                        &middot; pass mark <span th:text="${assessment.passingScore} + '%'">60%</span>
                        &middot; <span th:text="${#lists.size(questions)}">0</span> questions
                    </p>
                </div>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/assessments}">&larr; Back</a>
            </div>

            <form th:action="@{/assessments/{id}/submit(id=${assessment.id})}" method="post" class="mt-3">
                <div class="card mb-3" th:each="q, stat : ${questions}">
                    <div class="card-header">
                        <span th:text="${stat.count} + '. ' + ${q.questionText}">Question</span>
                    </div>
                    <div class="card-body">
                        <div class="form-check mb-2" th:each="opt : ${q.options}">
                            <input class="form-check-input" type="radio"
                                   th:name="'question_' + ${q.id}" th:value="${opt.id}"
                                   th:id="'q' + ${q.id} + 'o' + ${opt.id}">
                            <label class="form-check-label" th:for="'q' + ${q.id} + 'o' + ${opt.id}"
                                   th:text="${opt.optionText}">Option</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Submit answers</button>
                    <a class="btn btn-outline-secondary" th:href="@{/assessments}">Cancel</a>
                </div>
            </form>

        </main>
    </div>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
